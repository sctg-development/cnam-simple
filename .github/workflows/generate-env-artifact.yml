name: Generate .env artifact

on:
  workflow_call:

jobs:
  generate-env:
    runs-on: ubuntu-latest
    steps:
      - name: Create .env file
        run: |
          echo "DOMAIN_NAME=${{ secrets.DOMAIN_NAME }}" > .env
          echo "TURBO_TEAM=${{ secrets.TURBO_TEAM }}" >> .env
          echo "TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}" >> .env
          echo "CLOUDFLARE_BACKEND=${{ secrets.CLOUDFLARE_BACKEND }}" >> .env
          echo "CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}" >> .env
          echo "CNAM_FORMATION_CODE=${{ secrets.CNAM_FORMATION_CODE }}" >> .env
          echo "CNAM_BEDEO_URL=${{ secrets.CNAM_BEDEO_URL }}" >> .env
          echo "CNAM_BEDEO_CURSUS_PATH=${{ secrets.CNAM_BEDEO_CURSUS_PATH }}" >> .env
          echo "CNAM_BEDEO_UNITE_VIEW_PATH=${{ secrets.CNAM_BEDEO_UNITE_VIEW_PATH }}" >> .env
          echo "SCRAPER_CACHE_OVERRIDE=${{ secrets.SCRAPER_CACHE_OVERRIDE }}" >> .env
          echo "SCRAPER_CACHE_TTL=${{ secrets.SCRAPER_CACHE_TTL }}" >> .env
          echo "SCRAPPER_LEVEL_2_CHECKPOINT=${{ secrets.SCRAPPER_LEVEL_2_CHECKPOINT }}" >> .env
          echo "VITE_BASE_PATH=/${{ github.event.repository.name }}/" >> .env

          # ensure file exists and is non-empty (fallback)
          if [ ! -f .env ] || [ ! -s .env ]; then
            echo "# GENERATED_EMPTY_ENV" > .env
          fi

          # debug output to help diagnose CI runs
          echo "-- .env content start --"
          sed -n '1,200p' .env || true
          echo "-- .env content end --"

      - name: Upload .env artifact
        uses: actions/upload-artifact@v5
        with:
          name: env-file
          path: .env
          if-no-files-found: error
          overwrite: true
          include-hidden-files: true
