name: Build printpdf wasm
on:
  workflow_call: {}
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  build-printpdf:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Download shared .env artifact
        uses: actions/download-artifact@v5
        with:
          name: shared-env
          path: .

      # .env.enc was crypted with openssl enc -aes-256-cbc -salt -in .env -out .env.enc -iter 10000  -pass pass:"${{ secrets.ARTIFACT_ENCRYPTION_KEY }}"
      # Decrypt it using the same key and parameters
      - name: Decrypt .env file
        run: |
          openssl enc -aes-256-cbc -d -salt -in .env.enc -out .env -iter 10000 -pass pass:"${{ secrets.ARTIFACT_ENCRYPTION_KEY }}"
          rm .env.enc
          # validate .env content by simply checking the presence of DOMAIN_NAME=${{ secrets.DOMAIN_NAME }} with or without quotes, to avoid issues with decryption producing an invalid .env file
          if ! grep -q "DOMAIN_NAME=${{ secrets.DOMAIN_NAME }}" .env && ! grep -q "DOMAIN_NAME=\"${{ secrets.DOMAIN_NAME }}\"" .env; then
            echo "Decrypted .env file does not contain expected DOMAIN_NAME value"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          target: wasm32-unknown-unknown
          toolchain: stable

      - name: Cache wasm-pack binary
        id: wasm-pack-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wasm-pack
          key: ${{ runner.os }}-wasm-pack-${{ hashFiles('**/libs/printpdf/Cargo.toml','**/Cargo.lock') }}

      - name: Install wasm-pack
        shell: bash
        run: |
          if [ -x "$HOME/.cargo/bin/wasm-pack" ]; then
            echo "wasm-pack found in cache: $HOME/.cargo/bin/wasm-pack"
            "$HOME/.cargo/bin/wasm-pack" --version || true
          else
            echo "wasm-pack not found in cache — installing via cargo"
            cd libs/printpdf && cargo install wasm-pack
          fi

      - name: Cache Cargo registry and build output
        id: cargo-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            libs/printpdf/target
          key: ${{ runner.os }}-cargo-printpdf-${{ hashFiles('**/libs/printpdf/Cargo.toml','**/Cargo.lock') }}

      - name: wasm-pack build
        shell: bash
        run: |
          # debug why libs/printf appears inexistent
          ls -la libs
          ls -la libs/printpdf
          cd libs/printpdf
          wasm-pack build --target web --no-pack --release --no-default-features --features "html,js-sys,gif,jpeg,png,pnm,tiff,bmp,webp"

      - name: wasm-split
        shell: bash
        continue-on-error: true
        run: |
          cd libs/printpdf
          cargo add wasm-splitter \
            --git https://github.com/DioxusLabs/dioxus.git \
            --rename wasm_split \
            --target 'cfg(all(target_arch="wasm32",target_os="unknown"))'

          # the macro has the same name, no rename needed
          cargo add wasm-split-macro \
              --git https://github.com/DioxusLabs/dioxus.git \
              --target 'cfg(all(target_arch="wasm32",target_os="unknown"))'

          # the CLI is optional; again rename if you prefer a different local name
          cargo add wasm-splitter \
              --git https://github.com/DioxusLabs/dioxus.git \
              --rename wasm-splitter \
              --target 'cfg(all(target_arch="wasm32",target_os="unknown"))' \
              --optional
          export RUSTFLAGS="-C link-arg=--emit-relocs -C debuginfo=2 -C"
          mkdir -p wasm
          mkdir -p splitted
          cargo build --target wasm32-unknown-unknown --features "html,js-sys,gif,jpeg,png,pnm,tiff,bmp,webp"
          wasm-bindgen --target web --out-dir wasm target/wasm32-unknown-unknown/debug/printpdf.wasm
          wasm-split-cli split target/wasm32-unknown-unknown/debug/printpdf.wasm wasm/printpdf_bg.wasm split

      - name: Inject default fonts into script.js
        shell: bash
        run: |
          cd libs/printpdf
          # Base64 encode fonts for WASM (no filesystem access)
          HELVETICA_B64=$(base64 -w 0 examples/assets/fonts/Helvetica.ttf)
          HELVETICA_BOLD_B64=$(base64 -w 0 examples/assets/fonts/Helvetica-Bold.ttf)
          HELVETICA_OBLIQUE_B64=$(base64 -w 0 examples/assets/fonts/Helvetica-Oblique.ttf)
          HELVETICA_BOLD_OBLIQUE_B64=$(base64 -w 0 examples/assets/fonts/Helvetica-BoldOblique.ttf)
          TIMES_B64=$(base64 -w 0 examples/assets/fonts/Times.ttf)
          TIMES_BOLD_B64=$(base64 -w 0 examples/assets/fonts/Times-Bold.ttf)
          TIMES_OBLIQUE_B64=$(base64 -w 0 examples/assets/fonts/Times-Oblique.ttf)
          TIMES_BOLD_OBLIQUE_B64=$(base64 -w 0 examples/assets/fonts/Times-BoldOblique.ttf)
          COURIER_B64=$(base64 -w 0 examples/assets/fonts/Courier.ttf)
          COURIER_BOLD_B64=$(base64 -w 0 examples/assets/fonts/Courier-Bold.ttf)
          COURIER_OBLIQUE_B64=$(base64 -w 0 examples/assets/fonts/Courier-Oblique.ttf)
          COURIER_BOLD_OBLIQUE_B64=$(base64 -w 0 examples/assets/fonts/Courier-BoldOblique.ttf)
          NOTO_SANS_JP_B64=$(base64 -w 0 examples/assets/fonts/NotoSansJP-Regular.otf)
          ROBOTO_B64=$(base64 -w 0 examples/assets/fonts/RobotoMedium.ttf)
          
          # Create the font object content
          FONT_OBJECT="\"Helvetica.ttf\": \"$HELVETICA_B64\",
              \"Helvetica-Bold.ttf\": \"$HELVETICA_BOLD_B64\",
              \"Helvetica-Oblique.ttf\": \"$HELVETICA_OBLIQUE_B64\",
              \"Helvetica-BoldOblique.ttf\": \"$HELVETICA_BOLD_OBLIQUE_B64\",
              \"Times.ttf\": \"$TIMES_B64\",
              \"Times-Bold.ttf\": \"$TIMES_BOLD_B64\",
              \"Times-Oblique.ttf\": \"$TIMES_OBLIQUE_B64\",
              \"Times-BoldOblique.ttf\": \"$TIMES_BOLD_OBLIQUE_B64\",
              \"Courier.ttf\": \"$COURIER_B64\",
              \"Courier-Bold.ttf\": \"$COURIER_BOLD_B64\",
              \"Courier-Oblique.ttf\": \"$COURIER_OBLIQUE_B64\",
              \"Courier-BoldOblique.ttf\": \"$COURIER_BOLD_OBLIQUE_B64\",
              \"NotoSansJP-Regular.otf\": \"$NOTO_SANS_JP_B64\",
              \"RobotoMedium.ttf\": \"$ROBOTO_B64\""
          
          # Replace the placeholder in script.js
          # Use a temp file approach to handle large base64 strings
          python3 << EOF
          import re
          
          with open('script.js', 'r') as f:
              content = f.read()
          
          # Replace the DEFAULT_FONTS placeholder
          font_object = '''$FONT_OBJECT'''
          new_content = re.sub(
              r'const DEFAULT_FONTS = \{[^}]*\};',
              'const DEFAULT_FONTS = {\n    ' + font_object + '\n};',
              content,
              flags=re.DOTALL
          )
          
          with open('script.js', 'w') as f:
              f.write(new_content)
          
          print("Fonts injected successfully")
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          path: 'libs/printpdf/pkg'
          name: printpdf-wasm
