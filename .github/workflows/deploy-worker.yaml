name: CloudflareWorkerDeploy

on:
    push:
      branches:
        - main
      paths:
        - apps/cloudflare-worker/**
        - .github/workflows/deploy-worker.yaml
        
    workflow_dispatch:

permissions:
    contents: write
    pages: write
    id-token: write
    packages: write
    attestations: write

jobs:
  create-env:
    uses: ./.github/workflows/create-env-artifact.yaml
    secrets: inherit

  build:
    needs: create-env
    runs-on: ubuntu-latest

    steps:
        - name: Checkout repository
          uses: actions/checkout@v6
          with:
              submodules: true

        - name: Set up Node.js
          uses: actions/setup-node@v6
          with:
             node-version: "24"

        - name: Cache Yarn dependencies
          uses: actions/cache@v5
          with:
            path: |
                .yarn/cache
                .yarn/unplugged
                .yarn/build-state.yml
                .yarn/install-state.gz
                node_modules
            key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
            restore-keys: |
                ${{ runner.os }}-yarn-

        - name: Cache Turborepo
          uses: actions/cache@v5
          with:
            path: .turbo
            key: ${{ runner.os }}-turbo-${{ github.sha }}
            restore-keys: |
                ${{ runner.os }}-turbo-

        - name: Install dependencies
          shell: bash
          run: |
            corepack enable
            yarn install --immutable
    

        - name: Download shared .env artifact
          uses: actions/download-artifact@v5
          with:
            name: shared-env       
            path: .

        # .env.enc was encrypted with openssl enc -aes-256-cbc -salt -in .env -out .env.enc -iter 10000  -pass pass:"${{ secrets.ARTIFACT_ENCRYPTION_KEY }}"
        # Decrypt it using the same key and parameters
        - name: Decrypt .env file
          run: |
            openssl enc -aes-256-cbc -d -salt -in .env.enc -out .env -iter 10000 -pass pass:"${{ secrets.ARTIFACT_ENCRYPTION_KEY }}"
            rm .env.enc
            # validate .env content by simply checking the presence of DOMAIN_NAME=${{ secrets.DOMAIN_NAME }} with or without quotes, to avoid issues with decryption producing an invalid .env file
            if ! grep -q "DOMAIN_NAME=${{ secrets.DOMAIN_NAME }}" .env && ! grep -q "DOMAIN_NAME=\"${{ secrets.DOMAIN_NAME }}\"" .env; then
              echo "Decrypted .env file does not contain expected DOMAIN_NAME value"
              exit 1
            fi
        - name: Replace "// vars.*" in wrangler.jsonc with a json string
          run: |
            cd apps/cloudflare-worker
            cp ../../.env .env
            cp wrangler.jsonc wrangler.jsonc.bak
            set -a && source .env && set +a
            cat .env
            # Escape special characters in ALLOWED_GROUPS for sed
            ESCAPED_ALLOWED_GROUPS=$(printf '%s\n' "$ALLOWED_GROUPS" | sed 's/[[\.*^$()+?{|]/\\&/g')
            node -e '
            const fs = require("fs");
            let s = fs.readFileSync("wrangler.jsonc.bak", "utf8");
            s = s.replace(/^[ \t]*\/\/[ \t]*"vars".*$/m, `"vars": {  "TURBO_TEAM": "${process.env.TURBO_TEAM}", "TURBO_TOKEN": "${process.env.TURBO_TOKEN}", "CLOUDFLARE_BACKEND": "${process.env.CLOUDFLARE_BACKEND}", "CORS_ORIGIN": "${process.env.CORS_ORIGIN}", "CNAM_FORMATION_CODE": "${process.env.CNAM_FORMATION_CODE}", "CNAM_BEDEO_URL": "${process.env.CNAM_BEDEO_URL}", "CNAM_BEDEO_CURSUS_PATH": "${process.env.CNAM_BEDEO_CURSUS_PATH}", "CNAM_BEDEO_UNITE_VIEW_PATH": "${process.env.CNAM_BEDEO_UNITE_VIEW_PATH}", "SCRAPER_CACHE_OVERRIDE": "${process.env.SCRAPER_CACHE_OVERRIDE}", "SCRAPER_CACHE_TTL": "${process.env.SCRAPER_CACHE_TTL}", "SCRAPPER_LEVEL_2_CHECKPOINT": "${process.env.SCRAPPER_LEVEL_2_CHECKPOINT}", "CLOUDFLARE_WORKER_MAX_BROWSER_INSTANCES": "${process.env.CLOUDFLARE_WORKER_MAX_BROWSER_INSTANCES}" }`);
            s = s.replace(/^[ \t]*\/\/[ \t]*"routes".*$/m, `,"routes": [{ "pattern": "${process.env.DOMAIN_NAME}", "custom_domain": true }]`);
            fs.writeFileSync("wrangler.jsonc", s, "utf8");
            console.log(s);
            '
            cat wrangler.jsonc
        - name: Deploy
          uses: cloudflare/wrangler-action@v3
          with:
            apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            workingDirectory: apps/cloudflare-worker
            vars: |
                DOMAIN_NAME
                TURBO_TEAM
                TURBO_TOKEN
                CLOUDFLARE_BACKEND
                CLOUDFLARE_WORKER_MAX_BROWSER_INSTANCES
                CORS_ORIGIN
                CNAM_FORMATION_CODE
                CNAM_BEDEO_URL
                CNAM_BEDEO_CURSUS_PATH
                CNAM_BEDEO_UNITE_VIEW_PATH
                SCRAPER_CACHE_OVERRIDE
                SCRAPER_CACHE_TTL
          env:
            DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
            TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            CLOUDFLARE_BACKEND: ${{ secrets.CLOUDFLARE_BACKEND }}
            CLOUDFLARE_WORKER_MAX_BROWSER_INSTANCES: ${{ secrets.CLOUDFLARE_WORKER_MAX_BROWSER_INSTANCES }}
            CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
            CNAM_FORMATION_CODE: ${{ secrets.CNAM_FORMATION_CODE }}
            CNAM_BEDEO_URL: ${{ secrets.CNAM_BEDEO_URL }}
            CNAM_BEDEO_CURSUS_PATH: ${{ secrets.CNAM_BEDEO_CURSUS_PATH }}
            CNAM_BEDEO_UNITE_VIEW_PATH: ${{ secrets.CNAM_BEDEO_UNITE_VIEW_PATH }}
            SCRAPER_CACHE_OVERRIDE: ${{ secrets.SCRAPER_CACHE_OVERRIDE }}
            SCRAPER_CACHE_TTL: ${{ secrets.SCRAPER_CACHE_TTL }}